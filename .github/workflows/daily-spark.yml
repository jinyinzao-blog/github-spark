name: Daily Spark

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate spark.txt with current date (overwrite)
        run: |
          date +"%Y-%m-%d %H:%M:%S" > spark.txt

      - name: Commit and push spark.txt
        run: |
          git config --global user.name "jinyinzao-blog"
          git config --global user.email "1075652537@qq.com"
          git add spark.txt
          git diff --staged --quiet || git commit -m "chore: Daily spark auto-commit $(date +%Y-%m-%d)"
          git push